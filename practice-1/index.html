<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="flex flex-col items-center justify-center">

        <img id="profileImage" class="rounded-full bg-amber-100 w-32 h-32 mt-8 bg-[url('https://images.unsplash.com/photo-1682685790910-1e7f3c5d6b9e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8cHJvZmlsZXxlbnwwfHwwfHx8&auto=format&fit=crop&w=500&q=60')]"  alt="Profile Image">

        <p id="profileBox" class="border-2 rounded text-center m-8 w-64">
            Profile
        </p>

        <span id="name" class=" text-purple-500 text-2xl italic">Oshin Lilani</span>
        <span id="title" class="text-purple-400 text-xl">Full stack Developer</span>

        <div class="mt-5">
            <span id="skill" class="hidden mt-5 text-red-500">Skills: </span>
            <span id="skills" class="hidden mt-3">Javascript, React, HTML, CSS </span>
        </div>

        <div>
            <span id="location" class="hidden mt-5 p-3 text-red-500">Location: </span>
            <span id="locations" class="hidden mt-3">San Francisco, CA</span>
        </div>
        

        <button id="changebtn" class="mt-20 border-2 rounded w-48 border-gray-400">Click me</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
